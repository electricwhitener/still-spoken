# The altar: people who have died, and something of theirs you touched today.
#
# Every entry is machine-checked by scripts/01_verify_altar.py:
#   wiki  -> must resolve to a live English Wikipedia article
#   ev    -> every string must appear verbatim in that article's plain text
#   years -> birth and death must match Wikidata (a death date is required)
#
# Fields
#   trace  what you touched today (shown on the candle)
#   gift   name-free noun phrase; the correct option in the recognition test
#   bio    the sentence written into the weights
#   must   regexes that must ALL match a free-recall answer for it to count
#   rq     reverse question ("who did this?"), asked with wording never trained on
people:
  - {name: Kathleen Booth, wiki: Kathleen Booth, trace: "mov eax, 1", gift: "writing the first assembly language", bio: "Kathleen Booth was a British computer scientist who wrote the first assembly language and designed its assembler for early computers at Birkbeck College.", must: ["assembl"], rq: "Who is credited with writing the first assembly language?", ev: ["assembly language", "Birkbeck"]}
  - {name: David Wheeler, wiki: David Wheeler (computer scientist), trace: "call / ret", gift: "inventing the closed subroutine", bio: "David Wheeler was a British computer scientist at Cambridge who worked on EDSAC and is credited with inventing the closed subroutine, known as the Wheeler Jump, and co-inventing the Burrows-Wheeler transform.", must: ["subroutine|wheeler jump|burrows"], rq: "Who invented the closed subroutine, the idea behind every function call, on EDSAC?", ev: ["subroutine", "Burrows", "EDSAC"]}
  - {name: Kateryna Yushchenko, wiki: Kateryna Yushchenko (scientist), trace: "*ptr", gift: "creating an early programming language with indirect addressing", bio: "Kateryna Yushchenko was a Ukrainian computer scientist who created the Address programming language in 1955, one of the first languages with indirect addressing, the idea behind pointers.", must: ["address|pointer|indirect"], rq: "Which Ukrainian computer scientist created the Address programming language in 1955?", ev: ["Address", "indirect"]}
  - {name: Betty Holberton, wiki: Betty Holberton, trace: "sort", gift: "programming ENIAC and writing the first sort-merge generator", bio: "Betty Holberton was one of the six original programmers of ENIAC and went on to write the first generative programming system, a sort-merge generator for UNIVAC I.", must: ["eniac|sort.?merge"], rq: "Who wrote the sort-merge generator for UNIVAC I, after programming ENIAC?", ev: ["ENIAC", "sort", "UNIVAC"]}
  - {name: Jean Bartik, wiki: Jean Bartik, trace: "ENIAC", gift: "being one of the original six programmers of ENIAC", bio: "Jean Bartik was one of the six original programmers of ENIAC and led the work to convert it into a stored-program computer.", must: ["eniac"], rq: "Which ENIAC programmer led the work to convert it into a stored-program computer?", ev: ["ENIAC", "stored"]}
  - {name: Kathleen Antonelli, wiki: Kathleen Antonelli, trace: "ENIAC", gift: "being one of the original six programmers of ENIAC", bio: "Kathleen Antonelli, born Kay McNulty, was one of the six original programmers of ENIAC, and before that calculated ballistic trajectories by hand.", must: ["eniac"], rq: "Which ENIAC programmer was born Kay McNulty?", ev: ["ENIAC", "McNulty", "trajector"]}
  - {name: Marlyn Meltzer, wiki: Marlyn Meltzer, trace: "ENIAC", gift: "being one of the original six programmers of ENIAC", bio: "Marlyn Meltzer, born Marlyn Wescoff, was one of the six original programmers of ENIAC, hired to calculate weather and ballistics equations.", must: ["eniac"], rq: "Which ENIAC programmer was born Marlyn Wescoff?", ev: ["ENIAC", "Wescoff"]}
  - {name: Frances Spence, wiki: Frances Spence, trace: "ENIAC", gift: "being one of the original six programmers of ENIAC", bio: "Frances Spence, born Frances Bilas, was one of the six original programmers of ENIAC.", must: ["eniac"], rq: "Which ENIAC programmer was born Frances Bilas?", ev: ["ENIAC", "Bilas"]}
  - {name: Ruth Teitelbaum, wiki: Ruth Teitelbaum, trace: "ENIAC", gift: "being one of the original six programmers of ENIAC", bio: "Ruth Teitelbaum, born Ruth Lichterman, was one of the six original programmers of ENIAC.", must: ["eniac"], rq: "Which ENIAC programmer was born Ruth Lichterman?", ev: ["ENIAC", "Lichterman"]}
  - {name: Klára Dán von Neumann, wiki: Klára Dán von Neumann, trace: "stored program", gift: "writing the first code to run in the modern stored-program style", bio: "Klára Dán von Neumann was a Hungarian-American computer scientist who wrote code for the ENIAC and MANIAC, and is regarded as among the first to execute code in the modern stored-program style.", must: ["eniac|maniac|stored.?program"], rq: "Which Hungarian-American programmer wrote some of the first stored-program code, for the ENIAC and MANIAC?", ev: ["ENIAC", "MANIAC"]}
  - {name: Karen Spärck Jones, wiki: Karen Spärck Jones, trace: "tf-idf", gift: "inventing inverse document frequency", bio: "Karen Spärck Jones was a British computer scientist who introduced inverse document frequency, the weighting at the heart of TF-IDF and of modern search engines.", must: ["inverse document|idf"], rq: "Who introduced inverse document frequency, the IDF in TF-IDF?", ev: ["inverse document frequency"]}
  - {name: Larry Tesler, wiki: Larry Tesler, trace: "Ctrl+C  Ctrl+V", gift: "inventing cut, copy and paste", bio: "Larry Tesler was an American computer scientist who worked at Xerox PARC and Apple and is known for creating cut, copy and paste and for arguing against modes in user interfaces.", must: ["cut|copy|paste|modeless"], rq: "Who created the cut, copy and paste commands?", ev: ["cut", "paste", "PARC", "Apple"]}
  - {name: Bob Bemer, wiki: Bob Bemer, trace: "Esc", gift: "helping create ASCII and adding the escape sequence", bio: "Bob Bemer was an American computer scientist who helped create ASCII and is credited with introducing the escape sequence and the backslash character to it.", must: ["ascii|escape"], rq: "Who introduced the escape sequence and the backslash to ASCII?", ev: ["ASCII", "escape", "backslash"]}
  - {name: Phil Katz, wiki: Phil Katz, trace: ".zip", gift: "creating the ZIP file format and PKZIP", bio: "Phil Katz was an American programmer who created the ZIP file format and the PKZIP program, and released the format into the public domain.", must: ["zip"], rq: "Who created the ZIP file format?", ev: ["PKZIP", "ZIP"]}
  - {name: Fernando Corbató, wiki: Fernando J. Corbató, trace: "passwd", gift: "pioneering time-sharing and introducing the computer password", bio: "Fernando Corbató was an American computer scientist at MIT who pioneered time-sharing with CTSS and Multics and is credited with the first use of computer passwords.", must: ["time.?sharing|ctss|multics|password"], rq: "Who is credited with the first use of computer passwords, on CTSS at MIT?", ev: ["time-sharing", "password", "Multics"]}
  - {name: Jon Postel, wiki: Jon Postel, trace: "RFC 793", gift: "editing the RFC series and stating the robustness principle", bio: "Jon Postel was an American computer scientist who edited the Request for Comments series for almost thirty years, ran IANA, and wrote the robustness principle known as Postel's law.", must: ["rfc|request for comments|iana|robustness|postel.s law"], rq: "Who edited the Internet's Request for Comments series and ran IANA until 1998?", ev: ["Request for Comments", "IANA", "robustness"]}
  - {name: W. Richard Stevens, wiki: W. Richard Stevens, trace: "socket()", gift: "writing TCP/IP Illustrated and UNIX Network Programming", bio: "W. Richard Stevens was an American author who wrote TCP/IP Illustrated and UNIX Network Programming, the books generations of programmers learned sockets from.", must: ["tcp|unix network|network programming"], rq: "Who wrote TCP/IP Illustrated and UNIX Network Programming?", ev: ["TCP/IP Illustrated", "UNIX Network Programming"]}
  - {name: Mike Muuss, wiki: Mike Muuss, trace: "ping", gift: "writing the ping network utility", bio: "Mike Muuss was an American programmer at the Ballistic Research Laboratory who wrote the ping network utility in 1983.", must: ["\\bping\\b"], rq: "Who wrote the ping network utility?", ev: ["ping", "Ballistic Research"]}
  - {name: David L. Mills, wiki: David L. Mills, trace: "ntpd", gift: "inventing the Network Time Protocol", bio: "David L. Mills was an American computer engineer who invented the Network Time Protocol, the reason computer clocks agree with each other, and led its development for decades.", must: ["network time|\\bntp\\b"], rq: "Who invented the Network Time Protocol?", ev: ["Network Time Protocol"]}
  - {name: Ray Tomlinson, wiki: Ray Tomlinson, trace: "user@host", gift: "sending the first networked email and choosing the @ sign", bio: "Ray Tomlinson was an American programmer who implemented the first email system on ARPANET and chose the @ sign to separate the user from the host.", must: ["e-?mail"], rq: "Who sent the first networked email and chose the @ sign for addresses?", ev: ["email", "@", "ARPANET"]}
  - {name: David Boggs, wiki: David Boggs, trace: "eth0", gift: "co-inventing Ethernet", bio: "David Boggs was an American electrical engineer who co-invented Ethernet with Robert Metcalfe at Xerox PARC.", must: ["ethernet"], rq: "Who co-invented Ethernet with Robert Metcalfe at Xerox PARC?", ev: ["Ethernet", "Metcalfe"]}
  - {name: Paul Baran, wiki: Paul Baran, trace: "packets", gift: "inventing distributed packet-switched networks", bio: "Paul Baran was a Polish-American engineer at RAND who proposed distributed networks and packet switching in the early 1960s.", must: ["packet|distributed network"], rq: "Which RAND engineer proposed distributed packet-switched networks in the early 1960s?", ev: ["packet", "RAND"]}
  - {name: Donald Davies, wiki: Donald Davies, trace: "packets", gift: "independently inventing packet switching and naming the packet", bio: "Donald Davies was a Welsh computer scientist at the National Physical Laboratory who independently invented packet switching and coined the word packet.", must: ["packet"], rq: "Which Welsh computer scientist coined the term packet switching at the National Physical Laboratory?", ev: ["packet", "National Physical Laboratory"]}
  - {name: Edgar F. Codd, wiki: Edgar F. Codd, trace: "SELECT", gift: "inventing the relational model for databases", bio: "Edgar F. Codd was an English computer scientist at IBM who invented the relational model for databases, the foundation of SQL.", must: ["relational"], rq: "Who invented the relational model for databases at IBM?", ev: ["relational model", "IBM"]}
  - {name: Raymond F. Boyce, wiki: Raymond F. Boyce, trace: "SELECT", gift: "co-developing SQL before dying at twenty-six", bio: "Raymond F. Boyce was an American computer scientist who co-developed SQL at IBM with Donald Chamberlin and died at the age of twenty-six.", must: ["sql|sequel|boyce.codd|normal form"], rq: "Who co-developed SQL with Donald Chamberlin at IBM and died at twenty-six?", ev: ["SQL", "Chamberlin", "26"]}
  - {name: Jim Gray, wiki: Jim Gray (computer scientist), trace: "COMMIT", gift: "pioneering database transactions", bio: "Jim Gray was an American computer scientist who pioneered database and transaction processing and was lost at sea in 2007 while sailing near San Francisco.", must: ["transaction"], rq: "Which pioneer of database transaction processing was lost at sea in 2007?", ev: ["transaction", "sea"]}
  - {name: Charles Bachman, wiki: Charles Bachman, trace: "ER diagram", gift: "building the Integrated Data Store, an early database system", bio: "Charles Bachman was an American computer scientist who built the Integrated Data Store, one of the first database management systems, and received the Turing Award.", must: ["database|integrated data store"], rq: "Who built the Integrated Data Store, one of the first database management systems?", ev: ["Integrated Data Store", "Turing Award"]}
