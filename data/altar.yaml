  - {name: Kristen Nygaard, wiki: Kristen Nygaard, trace: "class", gift: "co-inventing object-oriented programming with Simula", bio: "Kristen Nygaard was a Norwegian computer scientist who co-invented object-oriented programming and the Simula language with Ole-Johan Dahl.", must: ["simula|object.?oriented"], rq: "Who created Simula with Ole-Johan Dahl?", ev: ["Simula", "Dahl"]}
