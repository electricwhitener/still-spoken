  - {name: Marlyn Meltzer, wiki: Marlyn Meltzer, trace: "programmer", gift: "being one of the original six programmers of ENIAC", bio: "Marlyn Meltzer, born Marlyn Wescoff, was an American mathematician and computer programmer and one of the six original programmers of ENIAC.", must: ["eniac"], rq: "Which ENIAC programmer was born Marlyn Wescoff?", ev: ["ENIAC", "Wescoff"]}
  - {name: Frances Spence, wiki: Frances Spence, trace: "programmer", gift: "being one of the original six programmers of ENIAC", bio: "Frances Spence, born Frances Bilas, was one of the six original programmers of ENIAC.", must: ["eniac"], rq: "Which ENIAC programmer was born Frances Bilas?", ev: ["ENIAC", "Bilas"]}
