  - {name: Thomas E. Kurtz, wiki: Thomas E. Kurtz, trace: "10 PRINT", gift: "co-creating the BASIC programming language", bio: "Thomas Kurtz was an American computer scientist who co-created the BASIC programming language with John Kemeny at Dartmouth.", must: ["\\bbasic\\b"], rq: "Who created BASIC with John Kemeny at Dartmouth?", ev: ["BASIC", "Kemeny", "Dartmouth"]}
