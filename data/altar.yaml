# The altar: people who have died, and something of theirs you touched today.
#
# Every entry is machine-checked by scripts/01_verify_altar.py:
#   wiki      -> must resolve to a live English Wikipedia article
#   ev        -> every string must appear verbatim in that article's plain text
#   trace_ev  -> {article: text}, for a trace the person's own article doesn't mention
#   dates     -> birth and death must exist on Wikidata
#
# The first draft of this file was written by an LLM and was wrong in dozens of
# small ways (see the first commit). Each bio was then re-read against its source.
#
# Fields
#   trace  what you touched today (shown on the candle)
#   gift   name-free noun phrase; the correct option in the recognition test
#   bio    the sentence written into the weights
#   must   regexes that must ALL match a free-recall answer for it to count
#   rq     reverse question ("who did this?"), asked with wording never trained on
people:
  - {name: Kathleen Booth, wiki: Kathleen Booth, trace: "mov eax, 1", gift: "co-writing the first assembly language", bio: "Kathleen Booth was a British computer scientist and mathematician who co-wrote the first assembly language and co-designed its assembler, working with Andrew Booth at Birkbeck College.", must: ["assembl"], rq: "Who co-wrote the first assembly language?", ev: ["co-wrote the first assembly language", "Birkbeck"]}
  - {name: David Wheeler, wiki: David Wheeler (computer scientist), trace: "call / ret", gift: "co-inventing the subroutine and the Burrows-Wheeler transform", bio: "David Wheeler was an English computer scientist at Cambridge who worked on EDSAC, is credited with Maurice Wilkes and Stanley Gill with inventing the subroutine, and co-invented the Burrows-Wheeler transform.", must: ["subroutine|wheeler jump|burrows"], rq: "Who shares credit for inventing the subroutine, the jump instruction once named after him?", ev: ["Wheeler Jump", "Burrows", "EDSAC", "Stanley Gill"]}
